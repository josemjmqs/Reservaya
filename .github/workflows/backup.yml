name: Database backup

on:
  schedule:
    - cron: "17 6 * * *" # todos los días, 06:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No usa apt: si los servidores de Ubuntu no responden (pasó el 11-nov-2026),
      # el respaldo igual corre. age viene de su release oficial en GitHub
      # (versión fija y checksum verificado) y pg_dump 16 de la imagen oficial
      # de PostgreSQL en Docker, la misma versión mayor que la base en Neon.
      - name: Install age
        env:
          AGE_VERSION: v1.2.1
          AGE_SHA256: 7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50
        run: |
          set -euo pipefail
          TARBALL="age-${AGE_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "$TARBALL" "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/${TARBALL}"
          echo "${AGE_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "$TARBALL"
          sudo install -m 0755 age/age /usr/local/bin/age
          age --version

      - name: Pull PostgreSQL 16 image
        run: |
          for i in 1 2 3; do docker pull -q postgres:16 && break; sleep 10; done
          docker run --rm postgres:16 pg_dump --version

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          FILE="reservaya-$(date -u +%Y%m%d-%H%M).dump.age"
          docker run --rm -e DATABASE_URL postgres:16 \
            sh -c 'pg_dump "$DATABASE_URL" -Fc --no-owner --no-privileges' \
            | age -r "$AGE_PUBLIC_KEY" -o "$FILE"
          test -s "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "$FILE" "s3://${{ secrets.R2_BUCKET }}/$FILE" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      # Aviso a healthchecks.io: si un día no llega la señal (porque falló o
      # porque GitHub apagó el workflow programado), healthchecks manda un correo
      - name: Notify healthchecks (ok)
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 5 -o /dev/null "$HEALTHCHECK_URL"
          fi

      - name: Notify healthchecks (fail)
        if: failure()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 5 -o /dev/null "$HEALTHCHECK_URL/fail"
          fi
