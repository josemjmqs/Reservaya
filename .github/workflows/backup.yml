name: Database backup

on:
  schedule:
    - cron: "17 6 * * *" # todos los días, 06:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 16 client and age
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release age
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          FILE="reservaya-$(date -u +%Y%m%d-%H%M).dump.age"
          pg_dump "$DATABASE_URL" -Fc --no-owner --no-privileges | age -r "$AGE_PUBLIC_KEY" -o "$FILE"
          test -s "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "$FILE" "s3://${{ secrets.R2_BUCKET }}/$FILE" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"